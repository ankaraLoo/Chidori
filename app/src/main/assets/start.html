<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<title>Chidori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0c13; --card:#121726; --card2:#182036; --line:#242c44; --txt:#e8edfb; --mut:#8792b3;
          --acc:#5ad1ff; --ok:#4ade80; --warn:#ffb86b; --bad:#ff6b81; }
  * { box-sizing:border-box; }
  html { background-color:var(--bg);
    background-image:radial-gradient(900px 520px at 8% -8%, rgba(90,209,255,.13), transparent 60%),
                     radial-gradient(700px 420px at 100% 105%, rgba(139,123,255,.11), transparent 60%);
    background-attachment:fixed; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; color:var(--txt);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 18px 56px; -webkit-text-size-adjust:100%; }
  main { width:100%; max-width:420px; display:grid; gap:18px; }
  .hide { display:none !important; }
  .brand { display:flex; align-items:center; justify-content:center; gap:8px; font-family:"Unbounded",system-ui,sans-serif;
    font-weight:800; font-size:24px; color:#fff; }
  .brand svg { width:28px; height:28px; fill:var(--acc); filter:drop-shadow(0 0 10px rgba(90,209,255,.8)); }
  .card { background:linear-gradient(180deg,rgba(24,32,54,.85),rgba(18,23,38,.92)); border:1px solid var(--line);
    border-radius:16px; padding:22px 20px; text-align:center; }
  .icon { width:64px; height:64px; margin:0 auto 14px; position:relative; display:grid; place-items:center; border-radius:50%;
    border:2px solid var(--line); }
  .icon svg { width:30px; height:30px; display:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  [data-s="search"] .icon { color:var(--acc); border-color:rgba(90,209,255,.25); border-top-color:var(--acc); animation:spin 1s linear infinite; }
  [data-s="search"] .icon .i-bolt { display:block; fill:currentColor; stroke:none; animation:unspin 1s linear infinite; }
  [data-s="closed"] .icon { color:var(--warn); border-color:rgba(255,184,107,.45); }
  [data-s="closed"] .icon .i-alert { display:block; }
  [data-s="net"] .icon { color:var(--warn); border-color:rgba(255,184,107,.45); }
  [data-s="net"] .icon .i-net { display:block; }
  [data-s="bad"] .icon { color:var(--bad); border-color:rgba(255,107,129,.45); }
  [data-s="bad"] .icon .i-alert { display:block; }
  [data-s="ok"] .icon { color:var(--ok); border-color:rgba(74,222,128,.5); }
  [data-s="ok"] .icon .i-check { display:block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes unspin { to { transform:rotate(-360deg); } }
  @media (prefers-reduced-motion:reduce) { .icon, .icon svg { animation:none !important; } }
  h1 { margin:0 0 6px; font-family:"Unbounded",system-ui,sans-serif; font-size:19px; line-height:1.3; font-weight:600; }
  p { margin:0; }
  .mut { color:var(--mut); }
  .small { font-size:13px; }
  .code { display:inline-block; margin-top:12px; padding:5px 12px; border-radius:99px; font:600 13px ui-monospace,Consolas,monospace;
    background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--txt); overflow-wrap:anywhere; }
  .retry { margin-top:12px; min-height:20px; }
  .actions { display:grid; gap:8px; margin-top:16px; }
  button { font:inherit; color:var(--txt); min-height:46px; padding:10px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); cursor:pointer; }
  button:active { filter:brightness(1.15); }
  button.primary { border:0; font-weight:700; color:#04121c; background:linear-gradient(135deg,#5ad1ff,#7aa8ff); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  input { width:100%; min-height:46px; padding:10px 12px; font:inherit; color:var(--txt); background:var(--card2);
    border:1px solid var(--line); border-radius:12px; }
  .manual { display:grid; gap:8px; margin-top:14px; text-align:left; }
  .manual label { color:var(--mut); font-size:13px; }
  details { margin-top:14px; text-align:left; }
  summary { cursor:pointer; color:var(--mut); font-size:13px; }
  pre { margin:8px 0 0; padding:10px; max-height:160px; overflow:auto; border-radius:10px; background:#0d111c; border:1px solid var(--line);
    font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; color:#b7c0dc; }
  .credit { position:fixed; right:14px; bottom:calc(10px + env(safe-area-inset-bottom)); font-size:11px; color:var(--mut); opacity:.9; pointer-events:none; }
  .credit b { color:var(--txt); font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 13.5h6.3L9 22l10-12.3h-6.4z"/></svg><span>Chidori</span></div>

  <section class="card" id="card" data-s="search" aria-live="polite">
    <div class="icon" aria-hidden="true">
      <svg class="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2 4 13.5h6.3L9 22l10-12.3h-6.4z"/></svg>
      <svg class="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <svg class="i-net" viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M3 3l18 18"/></svg>
      <svg class="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="title">Sunucu aranıyor…</h1>
    <p id="text" class="mut"></p>
    <div id="code" class="code hide"></div>
    <p id="retry" class="retry mut small"></p>

    <div class="actions">
      <button id="now" class="primary hide" type="button">Şimdi dene</button>
      <button id="manualBtn" class="hide" type="button">Adresi elle gir</button>
    </div>

    <div id="manualBox" class="manual hide">
      <label for="manual">Sunucu adresi</label>
      <input id="manual" type="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://….trycloudflare.com">
      <button id="saveManual" class="primary" type="button">Kaydet ve dene</button>
      <button id="clearManual" type="button">Otomatik adresi kullan</button>
    </div>

    <details id="det">
      <summary>Ayrıntılar</summary>
      <pre id="log"></pre>
      <button id="copy" type="button" style="margin-top:8px;width:100%">Sunucu sahibine göndermek için kopyala</button>
    </details>
  </section>
</main>
<div class="credit">made by <b>Sirzenich</b> · <span id="ver"></span></div>

<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const hasBridge = typeof Chidori !== "undefined";
let cfg = {}, info = [], busy = false, tries = 0, timer = null, left = 0;

function log(t) {
  info.push(new Date().toLocaleTimeString("tr-TR") + "  " + t);
  if (info.length > 40) info.shift();
  $("log").textContent = info.slice(-14).join("\n");
}

function view(state, title, text, code) {
  $("card").dataset.s = state;
  $("title").textContent = title;
  $("text").textContent = text || "";
  $("code").textContent = code ? "Hata kodu: " + code : "";
  $("code").classList.toggle("hide", !code);
}

function stopRetry() { clearInterval(timer); timer = null; $("retry").textContent = ""; }

function scheduleRetry() {
  stopRetry();
  left = tries <= 6 ? 10 : 20;
  const tick = () => {
    $("retry").textContent = "Açılınca kendiliğinden bağlanır · " + left + " sn sonra tekrar denenecek";
    if (left-- <= 0) { stopRetry(); run(); }
  };
  tick();
  timer = setInterval(tick, 1000);
}

function fail(kind, title, text, code) {
  view(kind, title, text, code);
  $("now").classList.remove("hide");
  $("manualBtn").classList.remove("hide");
  tries++;
  scheduleRetry();
}

// Android tarafındaki işleri (adres bulma, sunucu yoklama) sözle bekle
function call(fn, ...args) {
  return new Promise(resolve => {
    const name = "cb" + Math.random().toString(36).slice(2);
    const t = setTimeout(() => { delete window[name]; resolve({ ok: false, code: "TIMEOUT", title: "Yanıt gelmedi", msg: "Uygulama içi işlem zaman aşımına uğradı." }); }, 20000);
    window[name] = r => { clearTimeout(t); delete window[name]; resolve(r); };
    try { Chidori[fn](...args, name); }
    catch (e) { clearTimeout(t); delete window[name]; resolve({ ok: false, code: "BRIDGE", title: "Uygulama hatası", msg: String(e) }); }
  });
}

function kindOf(code) {
  if (code === "NET") return "net";
  if (/^(HTTP 5|HTTP 530|DNS|TIMEOUT|REFUSED|CLOSED|EMPTY)/.test(code)) return "closed";
  return "bad";
}

async function run() {
  if (busy) return;
  busy = true;
  stopRetry();
  $("now").classList.add("hide");
  view("search", "Sunucu aranıyor…", "");
  try {
    let url = "";
    const p = await call("pointer");
    log("adres servisi: " + (p.ok ? p.url : p.code + " · " + (p.title || "")));
    if (p.ok) url = p.url;
    else if (p.code === "CLOSED") return fail("closed", p.title, p.msg, "KAPALI");
    if (!url) url = cfg.manual || cfg.saved || "";
    if (!url) {
      return fail(kindOf(p.code), p.title || "Sunucu adresi bulunamadı", p.msg || "Adresi elle girebilirsin.", p.code);
    }
    log("deneniyor: " + url);
    const r = await call("ping", url);
    log("sonuç: " + (r.ok ? "açık (" + r.ms + " ms)" : r.code + " · " + r.msg));
    if (r.ok) {
      if (r.locked) return fail("closed", "Girişler kapalı", "Sunucu sahibi şu an yeni girişleri kilitlemiş. Açılınca kendiliğinden bağlanır.", "KİLİTLİ");
      view("ok", "Bağlanılıyor…", "Sunucu açık.");
      tries = 0;
      Chidori.open(url);
      return;
    }
    fail(kindOf(r.code), r.title, r.msg, r.code);
  } finally {
    busy = false;
  }
}

$("now").onclick = () => { tries = 0; run(); };
$("manualBtn").onclick = () => { stopRetry(); $("manualBox").classList.toggle("hide"); $("manual").value = cfg.manual || ""; $("manual").focus(); };
$("manual").addEventListener("focus", stopRetry);
$("saveManual").onclick = () => {
  const v = $("manual").value.trim().replace(/\/+$/, "");
  if (!/^https:\/\/[^\s/]+$/i.test(v)) { $("manual").setCustomValidity("Adres https:// ile başlamalı"); $("manual").reportValidity(); return; }
  $("manual").setCustomValidity("");
  Chidori.save("manual", v);
  cfg.manual = v;
  $("manualBox").classList.add("hide");
  tries = 0;
  run();
};
$("clearManual").onclick = () => { Chidori.save("manual", ""); cfg.manual = ""; $("manualBox").classList.add("hide"); tries = 0; run(); };
$("copy").onclick = () => {
  const t = "Chidori " + (cfg.version || "") + "\n" + info.join("\n");
  const ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); $("copy").textContent = "Kopyalandı"; } catch (e) { $("copy").textContent = "Kopyalanamadı"; }
  ta.remove();
  setTimeout(() => { $("copy").textContent = "Sunucu sahibine göndermek için kopyala"; }, 2000);
};

// ---- başlangıç ----
if (!hasBridge) {
  view("bad", "Bu sayfa yalnızca uygulamada çalışır", "Chidori uygulamasını kullan.", "");
} else {
  try { cfg = JSON.parse(Chidori.config()); } catch (e) { cfg = {}; }
  $("ver").textContent = "v" + (cfg.version || "");
  const err = q.get("err");
  if (err) log("bağlantı koptu: " + err);
  run();
}
</script>
</body>
</html>
